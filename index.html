<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smiley Timer</title>
    <style>
        /* =========================================================
           ESTILOS GENERALES
        ========================================================= */
        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            overflow-x: hidden;
            font-family: "Comic Sans MS", "Comic Sans", cursive;
            background: #ffe600;
        }

        button,
        select {
            font-family: inherit;
        }

        /* =========================================================
           NAVEGACIÓN
        ========================================================= */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 72px;
            display: flex;
            align-items: center;
            gap: 28px;
            padding: 0 28px;
            background: rgba(15, 15, 15, 0.96);
            border-bottom: 3px solid #ffe600;
            z-index: 100000;
        }

        .logo {
            margin-right: auto;
            color: white;
            font-size: 27px;
            font-weight: bold;
            -webkit-text-stroke: 1.5px #ffe600;
            text-shadow: 2px 2px #000, 0 0 10px #ffe600;
        }

        .navButton {
            border: 0;
            background: transparent;
            color: white;
            font-size: 19px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, color 0.2s;
        }

        .navButton:hover {
            color: #ffe600;
            transform: scale(1.08);
        }

        .navButton.active {
            color: #ffe600;
            text-decoration: underline;
        }

        /* =========================================================
           ESTRUCTURA DE PÁGINAS
        ========================================================= */
        .page {
            display: none;
        }

        .page.active {
            display: block;
        }

        /* =========================================================
           SECCIÓN: EXPLORAR
        ========================================================= */
        #explore {
            position: relative;
            min-height: 85000px;
            background-color: #ffe600;
            background-image: url("56 sin título_20260922190604.png");
            background-repeat: repeat;
            background-size: 520px;
        }

        .hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 110px 20px 30px;
            position: relative;
            z-index: 20;
        }

        .hero h1 {
            margin: 0;
            color: white;
            font-size: clamp(60px, 10vw, 135px);
            -webkit-text-stroke: 5px #e3cc00;
            text-shadow: 6px 6px #000, 0 0 15px white;
        }

        .hero p {
            color: white;
            font-size: 28px;
            font-weight: bold;
            text-shadow: 3px 3px black;
        }

        .arrow {
            margin-top: 25px;
            color: white;
            font-size: 55px;
            text-shadow: 3px 3px black;
            animation: arrow 1s infinite alternate;
        }

        @keyframes arrow {
            from {
                transform: translateY(0);
            }
            to {
                transform: translateY(15px);
            }
        }

        .explorationSpace {
            height: 76000px;
        }

        /* =========================================================
           COMPANION / PERSONAJE
        ========================================================= */
        #smileyCompanion {
            position: fixed;
            left: 35px;
            bottom: 25px;
            width: 230px;
            z-index: 6000;
            pointer-events: none;
            opacity: 1;
            visibility: visible;
            transition: transform 0.3s, opacity 0.5s ease, filter 0.3s;
        }

        #companionSprite {
            display: block;
            width: 100%;
            max-height: 300px;
            object-fit: contain;
            opacity: 1;
            filter: drop-shadow(8px 10px 4px rgba(0, 0, 0, 0.45));
        }

        #companionDialogue {
            position: absolute;
            left: 205px;
            bottom: 85px;
            width: 380px;
            display: none;
            padding: 20px 23px;
            background: white;
            border: 5px solid #e7cf00;
            border-radius: 20px;
            color: #111;
            font-size: 20px;
            font-weight: bold;
            box-shadow: 8px 8px 0 rgba(0, 0, 0, 0.3);
        }

        /* =========================================================
           EFECTOS VISUALES Y FINAL
        ========================================================= */
        #darkness {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle, rgba(70, 0, 0, 0.25), rgba(80, 0, 0, 0.95));
            opacity: 0;
            pointer-events: none;
            z-index: 3000;
        }

        .dialogueGlitch {
            animation: dialogueGlitch 0.12s infinite;
        }

        @keyframes dialogueGlitch {
            0% { transform: translate(0); }
            25% { transform: translate(3px, -2px); }
            50% { transform: translate(-3px, 1px); }
            75% { transform: translate(2px, 2px); }
            100% { transform: translate(0); }
        }

        #ending {
            min-height: 100vh;
            position: relative;
            z-index: 5000;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            background-image: url("57 sin título_20260922191646.png");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .endBox {
            padding: 45px;
        }

        .endBox h2 {
            margin: 0;
            color: white;
            font-size: clamp(50px, 8vw, 105px);
            -webkit-text-stroke: 4px #ffe600;
            text-shadow: 5px 5px black;
        }

        .endBox p {
            color: white;
            font-size: 30px;
            font-weight: bold;
            text-shadow: 3px 3px black;
        }

        .secret {
            margin-top: 150px;
            color: black !important;
            opacity: 0.09;
            font-size: 17px !important;
            text-shadow: none !important;
        }

        /* =========================================================
           SECCIÓN: TIMER
        ========================================================= */
        #timer {
            min-height: 100vh;
            background-color: #ffe600;
            background-image: url("56 sin título_20260922190655.png");
            background-repeat: repeat;
            background-size: 450px;
        }

        .timerPage {
            min-height: 100vh;
            padding: 120px 20px 70px;
            text-align: center;
        }

        .timerPage h1 {
            margin: 0;
            color: white;
            font-size: clamp(60px, 10vw, 125px);
            -webkit-text-stroke: 5px #d7c000;
            text-shadow: 6px 6px black;
        }

        #timerSubtitle {
            color: white;
            font-size: 29px;
            font-weight: bold;
            text-shadow: 3px 3px black;
        }

        .timerSmiley {
            width: 240px;
            max-width: 70vw;
            margin: 20px;
            filter: drop-shadow(10px 12px 5px rgba(0, 0, 0, 0.4));
            animation: timerFloat 3s ease-in-out infinite;
        }

        @keyframes timerFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        #countdown {
            max-width: 1050px;
            margin: 25px auto 40px;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .timeUnit {
            min-width: 155px;
            padding: 20px;
            background: #111;
            color: white;
            border: 5px solid #ffe600;
            border-radius: 18px;
            box-shadow: 7px 7px 0 rgba(0, 0, 0, 0.35);
        }

        .timeUnit strong {
            display: block;
            color: #ffe600;
            font-size: 43px;
        }

        .timeUnit span {
            font-size: 14px;
            font-weight: bold;
        }

        #language {
            min-width: 230px;
            padding: 13px 20px;
            border: 4px solid #111;
            border-radius: 14px;
            background: white;
            font-size: 18px;
            cursor: pointer;
        }

        /* =========================================================
           SECCIÓN: GALERÍA
        ========================================================= */
        #gallery {
            min-height: 100vh;
            padding: 110px 20px 80px;
            text-align: center;
            background-color: #ffe600;
            background-image: url("56 sin título_20260922190655.png");
            background-repeat: repeat;
            background-size: 400px;
        }

        #gallery h1 {
            margin: 20px;
            color: white;
            font-size: clamp(60px, 10vw, 120px);
            -webkit-text-stroke: 5px #d7bf00;
            text-shadow: 5px 5px black;
        }

        .galleryContainer {
            max-width: 1300px;
            margin: auto;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 35px;
        }

        .galleryCard {
            width: min(520px, 90vw);
            padding: 35px;
            background: rgba(255, 255, 255, 0.86);
            border: 5px solid white;
            border-radius: 30px;
            box-shadow: 10px 10px 0 rgba(0, 0, 0, 0.25);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .galleryCard:hover {
            transform: translateY(-8px) rotate(-1deg);
            box-shadow: 15px 17px 0 rgba(0, 0, 0, 0.25);
        }

        .galleryCard img {
            display: block;
            width: 100%;
            max-height: 430px;
            margin: auto;
            object-fit: contain;
            border-radius: 15px;
        }

        .galleryCard h2 {
            margin-bottom: 0;
            font-size: 35px;
        }

        /* =========================================================
           DISEÑO RESPONSIVO (MÓVIL)
        ========================================================= */
        @media (max-width: 700px) {
            nav {
                padding: 0 10px;
                gap: 9px;
            }

            .logo {
                font-size: 15px;
            }

            .navButton {
                font-size: 13px;
            }

            #smileyCompanion {
                width: 135px;
                left: 10px;
                bottom: 10px;
            }

            #companionDialogue {
                left: 105px;
                bottom: 50px;
                width: 215px;
                padding: 13px;
                font-size: 14px;
            }

            .timeUnit {
                min-width: 125px;
            }

            .galleryCard {
                padding: 20px;
            }
        }
    </style>
</head>
<body>

    <!-- =========================================================
         NAVEGACIÓN
    ========================================================= -->
    <nav>
        <div class="logo">Smiley Timer ☺</div>
        <button id="exploreButton" class="navButton active" onclick="showPage('explore')">Explorar</button>
        <button id="timerButton" class="navButton" onclick="showPage('timer')">Timer</button>
        <button id="galleryButton" class="navButton" onclick="showPage('gallery')">Galería</button>
    </nav>

    <!-- =========================================================
         PÁGINA: EXPLORAR
    ========================================================= -->
    <main id="explore" class="page active">
        <section class="hero">
            <h1>Smiley Timer</h1>
            <p>Scroll down and explore!</p>
            <div class="arrow">↓</div>
        </section>

        <div class="explorationSpace"></div>

        <section id="ending">
            <div class="endBox">
                <h2>Congratulations!</h2>
                <p>You've reached the end of the page!</p>
                <p class="secret">he is watching us</p>
            </div>
        </section>
    </main>

    <!-- =========================================================
         PERSONAJE Y EFECTOS
    ========================================================= -->
    <div id="smileyCompanion">
        <img id="companionSprite" src="56 sin título_20260922190504.png" alt="Smiley">
        <div id="companionDialogue"></div>
    </div>

    <div id="darkness"></div>

    <!-- =========================================================
         PÁGINA: TIMER
    ========================================================= -->
    <main id="timer" class="page">
        <section class="timerPage">
            <h1>Smiley Timer</h1>
            <p id="timerSubtitle">Time until the year 3524</p>
            <img src="56 sin título_20260922190504.png" class="timerSmiley" alt="Smiley">

            <div id="countdown">
                <div class="timeUnit">
                    <strong id="years">0</strong>
                    <span id="yearsLabel">YEARS</span>
                </div>
                <div class="timeUnit">
                    <strong id="days">0</strong>
                    <span id="daysLabel">DAYS</span>
                </div>
                <div class="timeUnit">
                    <strong id="hours">00</strong>
                    <span id="hoursLabel">HOURS</span>
                </div>
                <div class="timeUnit">
                    <strong id="minutes">00</strong>
                    <span id="minutesLabel">MINUTES</span>
                </div>
                <div class="timeUnit">
                    <strong id="seconds">00</strong>
                    <span id="secondsLabel">SECONDS</span>
                </div>
            </div>

            <select id="language">
                <option value="auto">🌐 Auto</option>
                <option value="es">Español</option>
                <option value="en">English</option>
                <option value="fr">Français</option>
                <option value="de">Deutsch</option>
                <option value="pt">Português</option>
                <option value="it">Italiano</option>
                <option value="nl">Nederlands</option>
                <option value="ru">Русский</option>
                <option value="ja">日本語</option>
                <option value="ko">한국어</option>
                <option value="zh">中文</option>
            </select>
        </section>
    </main>

    <!-- =========================================================
         PÁGINA: GALERÍA
    ========================================================= -->
    <main id="gallery" class="page">
        <h1 id="galleryTitle">Galería</h1>
        <div class="galleryContainer">
            <div class="galleryCard">
                <img src="58 sin título_20260922192359.png" alt="Smiley Cube">
                <h2>Smiley Cube</h2>
            </div>
            <div class="galleryCard">
                <img src="a98c128d37aefc208b794e092faa478b.jpg" alt="Touhou">
                <h2>la de touhou xd</h2>
            </div>
        </div>
    </main>

    <!-- =========================================================
         LÓGICA JAVASCRIPT
    ========================================================= -->
    <script>
        /* --- RUTA DE ARCHIVOS Y SECUENCIA DE SPRITES --- */
        const NORMAL_SPRITE = "56 sin título_20260922190504.png";
        const TALKING_SPRITE = "58 sin título_20260922191951.png";
        const RANDOM_SPRITES = [
            "58 sin título_20260922192122.png",
            "58 sin título_20260922192057.png"
        ];

        /* --- CONFIGURACIÓN DE EVENTOS RAROS --- */
        const RANDOM_CHANCE = 0.10;
        const RANDOM_DURATION = 2000;
        const RANDOM_CHECK_INTERVAL = 5000;

        /* --- ELEMENTOS DEL DOM --- */
        const explore = document.getElementById("explore");
        const companion = document.getElementById("smileyCompanion");
        const sprite = document.getElementById("companionSprite");
        const dialogue = document.getElementById("companionDialogue");
        const darkness = document.getElementById("darkness");

        /* --- SECUENCIA DE ETAPAS DE SCROLL CON DEGRADACIÓN Y MUERTE --- */
        const stages = [
            { start: 0.00, sprite: NORMAL_SPRITE, text: "", opacity: 1 },
            { start: 0.15, sprite: "58 sin título_20260922192158.png", text: "", opacity: 1 },
            { start: 0.27, sprite: TALKING_SPRITE, text: "Looks like you're scrolling pretty far. If I were you, I wouldn't do that.", opacity: 1 },
            { start: 0.38, sprite: "58 sin título_20260922192211.png", text: "", opacity: 1 },
            { start: 0.48, sprite: "58 sin título_20260922192229.png", text: "What do you think you're doing?", opacity: 1 },
            { start: 0.54, sprite: "58 sin título_20260922192238.png", text: "", opacity: 1 },
            { start: 0.61, sprite: "58 sin título_20260922192238.png", text: "Please stop.", opacity: 1 },
            { start: 0.68, sprite: "58 sin título_20260922192315.png", text: "", opacity: 1 },
            { start: 0.75, sprite: "58 sin título_20260922192315.png", text: "CAN ANYONE HEAR ME?", opacity: 1 },
            { start: 0.82, sprite: "58 sin título_20260922192327.png", text: "HELP...", opacity: 1 },
            { start: 0.88, sprite: "58 sin título_20260922192327.png", text: "", opacity: 0.6 },
            { start: 0.94, sprite: "58 sin título_20260922192327.png", text: "", opacity: 0 } // Muere / Desaparece por completo
        ];

        let currentStage = -1;

        /* --- MANTENER VISIBILIDAD DEL PERSONAJE (HASTA QUE MUERA) --- */
        function forceCharacterVisible() {
            if (explore.classList.contains("active") && currentStage < stages.length - 1) {
                companion.style.display = "block";
                companion.style.visibility = "visible";
            }
        }

        /* --- GESTIÓN DE NAVEGACIÓN --- */
        function showPage(name) {
            document.querySelectorAll(".page").forEach(page => {
                page.classList.remove("active");
            });

            document.querySelectorAll(".navButton").forEach(button => {
                button.classList.remove("active");
            });

            document.getElementById(name).classList.add("active");
            
            const btn = document.getElementById(name + "Button");
            if (btn) btn.classList.add("active");

            window.scrollTo({ top: 0, behavior: "auto" });

            if (name === "explore") {
                currentStage = -1;
                companion.style.opacity = "1";
                forceCharacterVisible();
                sprite.src = NORMAL_SPRITE;
                dialogue.style.display = "none";
                dialogue.textContent = "";
                setTimeout(updateExplore, 20);
            } else {
                companion.style.display = "none";
                darkness.style.opacity = "0";
            }
        }

        /* --- SISTEMA DE EVENTO RARO (10%) --- */
        let randomSpriteActive = false;
        let randomSpriteTimeout = null;

        function tryRandomSprite() {
            if (!explore.classList.contains("active")) return;
            if (randomSpriteActive || currentStage >= stages.length - 1) return;
            if (Math.random() >= RANDOM_CHANCE) return;

            randomSpriteActive = true;
            forceCharacterVisible();

            const randomIndex = Math.floor(Math.random() * RANDOM_SPRITES.length);
            sprite.src = RANDOM_SPRITES[randomIndex];

            dialogue.style.display = "none";
            dialogue.textContent = "";

            clearTimeout(randomSpriteTimeout);
            randomSpriteTimeout = setTimeout(() => {
                randomSpriteActive = false;
                updateExplore();
            }, RANDOM_DURATION);
        }

        setInterval(tryRandomSprite, RANDOM_CHECK_INTERVAL);

        function setStage(index) {
            if (randomSpriteActive) return;
            if (index === currentStage) return;

            currentStage = index;
            const stage = stages[index];
            if (!stage) return;

            sprite.src = stage.sprite;
            companion.style.opacity = stage.opacity;

            if (stage.opacity === 0) {
                companion.style.display = "none";
            } else {
                companion.style.display = "block";
            }

            if (stage.text) {
                dialogue.textContent = stage.text;
                dialogue.style.display = "block";
            } else {
                dialogue.textContent = "";
                dialogue.style.display = "none";
            }

            if (index >= 4) {
                dialogue.classList.add("dialogueGlitch");
                dialogue.style.background = "#080808";
                dialogue.style.color = "#ff3333";
                dialogue.style.borderColor = "#850000";
            } else {
                dialogue.classList.remove("dialogueGlitch");
                dialogue.style.background = "white";
                dialogue.style.color = "#111";
                dialogue.style.borderColor = "#e7cf00";
            }
        }

        /* --- LÓGICA DE SCROLL --- */
        function updateExplore() {
            if (!explore.classList.contains("active")) return;

            const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
            if (maxScroll <= 0) return;

            const progress = Math.min(1, Math.max(0, window.scrollY / maxScroll));
            let stageIndex = 0;

            for (let i = 0; i < stages.length; i++) {
                if (progress >= stages[i].start) {
                    stageIndex = i;
                }
            }

            if (!randomSpriteActive) {
                setStage(stageIndex);
            }

            /* Gradiente de Oscuridad */
            let amount = 0;
            if (progress >= 0.35 && progress < 0.65) {
                amount = ((progress - 0.35) / (0.65 - 0.35)) * 0.75;
            } else if (progress >= 0.65 && progress < 0.86) {
                amount = 0.75;
            } else if (progress >= 0.86 && progress < 0.94) {
                amount = 0.75 * (1 - ((progress - 0.86) / (0.94 - 0.86)));
            } else if (progress >= 0.94) {
                amount = 0;
            }

            darkness.style.opacity = Math.max(0, Math.min(0.75, amount));
        }

        window.addEventListener("scroll", updateExplore, { passive: true });

        /* --- SONIDO DE FINAL --- */
        const victorySound = new Audio("freesound_community-goodresult-82807.mp3");
        let victoryPlayed = false;
        const ending = document.getElementById("ending");

        const endingObserver = new IntersectionObserver(
            entries => {
                entries.forEach(entry => {
                    if (entry.isIntersecting && !victoryPlayed) {
                        victoryPlayed = true;
                        victorySound.currentTime = 0;
                        victorySound.play().catch(() => {});
                    }
                });
            },
            { threshold: 0.35 }
        );

        endingObserver.observe(ending);

        /* --- TEMPORIZADOR AÑO 3524 --- */
        const targetDate = new Date(3524, 0, 1, 0, 0, 0);

        function updateTimer() {
            const now = new Date();
            let difference = targetDate.getTime() - now.getTime();

            if (difference < 0) difference = 0;

            const SECOND = 1000;
            const MINUTE = SECOND * 60;
            const HOUR = MINUTE * 60;
            const DAY = HOUR * 24;
            const YEAR = DAY * 365.2425;

            const years = Math.floor(difference / YEAR);
            difference -= years * YEAR;

            const days = Math.floor(difference / DAY);
            difference -= days * DAY;

            const hours = Math.floor(difference / HOUR);
            difference -= hours * HOUR;

            const minutes = Math.floor(difference / MINUTE);
            difference -= minutes * MINUTE;

            const seconds = Math.floor(difference / SECOND);

            const locale = getCurrentLocale();

            document.getElementById("years").textContent = years.toLocaleString(locale);
            document.getElementById("days").textContent = days.toLocaleString(locale);
            document.getElementById("hours").textContent = String(hours).padStart(2, "0");
            document.getElementById("minutes").textContent = String(minutes).padStart(2, "0");
            document.getElementById("seconds").textContent = String(seconds).padStart(2, "0");
        }

        /* --- TRADUCCIONES Y LENGUAJE --- */
        const translations = {
            es: { explore: "Explorar", timer: "Timer", gallery: "Galería", subtitle: "Tiempo hasta el año 3524", years: "AÑOS", days: "DÍAS", hours: "HORAS", minutes: "MINUTOS", seconds: "SEGUNDOS" },
            en: { explore: "Explore", timer: "Timer", gallery: "Gallery", subtitle: "Time until the year 3524", years: "YEARS", days: "DAYS", hours: "HOURS", minutes: "MINUTES", seconds: "SECONDS" },
            fr: { explore: "Explorer", timer: "Minuteur", gallery: "Galerie", subtitle: "Temps restant jusqu'à l'année 3524", years: "ANS", days: "JOURS", hours: "HEURES", minutes: "MINUTES", seconds: "SECONDES" },
            de: { explore: "Erkunden", timer: "Timer", gallery: "Galerie", subtitle: "Zeit bis zum Jahr 3524", years: "JAHRE", days: "TAGE", hours: "STUNDEN", minutes: "MINUTEN", seconds: "SEKUNDEN" },
            pt: { explore: "Explorar", timer: "Timer", gallery: "Galeria", subtitle: "Tempo até o ano 3524", years: "ANOS", days: "DIAS", hours: "HORAS", minutes: "MINUTOS", seconds: "SEGUNDOS" },
            it: { explore: "Esplora", timer: "Timer", gallery: "Galleria", subtitle: "Tempo fino all'anno 3524", years: "ANNI", days: "GIORNI", hours: "ORE", minutes: "MINUTI", seconds: "SECONDI" },
            nl: { explore: "Verkennen", timer: "Timer", gallery: "Galerij", subtitle: "Tijd tot het jaar 3524", years: "JAREN", days: "DAGEN", hours: "UREN", minutes: "SECONDEN" },
            ru: { explore: "Исследовать", timer: "Таймер", gallery: "Галерея", subtitle: "Время до 3524 года", years: "ЛЕТ", days: "ДНЕЙ", hours: "ЧАСОВ", minutes: "МИНУТ", seconds: "СЕКУНД" },

        function getCurrentLocale() {
            const selected = document.getElementById("language").value;
            if (selected === "auto") {
                return navigator.language || "en";
            }
            return selected;
        }

        function translatePage() {
            let language = document.getElementById("language").value;
            if (language === "auto") {
                language = (navigator.language || "en").split("-")[0];
            }

            const t = translations[language] || translations.en;

            document.getElementById("exploreButton").textContent = t.explore;
            document.getElementById("timerButton").textContent = t.timer;
            document.getElementById("galleryButton").textContent = t.gallery;
            document.getElementById("galleryTitle").textContent = t.gallery;
            document.getElementById("timerSubtitle").textContent = t.subtitle;
            document.getElementById("yearsLabel").textContent = t.years;
            document.getElementById("daysLabel").textContent = t.days;
            document.getElementById("hoursLabel").textContent = t.hours;
            document.getElementById("minutesLabel").textContent = t.minutes;
            document.getElementById("secondsLabel").textContent = t.seconds;

            updateTimer();
        }

        document.getElementById("language").addEventListener("change", translatePage);

        /* --- INICIALIZACIÓN --- */
        translatePage();
        updateTimer();
        setInterval(updateTimer, 1000);

        sprite.src = NORMAL_SPRITE;
        setStage(0);
        updateExplore();
